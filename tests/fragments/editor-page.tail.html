<pre id="out"></pre>
<script>
// The editor as it runs over the real page: editor-page-logic.html?on=page. Here it is its own parent, so the
// page's messages are sent from this script.
(async () => {
  const r = {}; await wait(500);
  const el = (id) => document.getElementById(id);
  const at = (id) => { const e = el(id); return e.hidden ? "hidden" : [e.style.left, e.style.top, e.style.width, e.style.height].map((v) => Math.round(parseFloat(v))).join(","); };
  const classes = () => [...document.body.classList].join(" ");
  const heard = []; addEventListener("message", (e) => { if (e.data && e.data.claudeThemes !== "layout") heard.push(e.data.claudeThemes); });
  const tell = async (boxes) => { postMessage({ claudeThemes: "layout", boxes }, "*"); await wait(60); };
  const page = { sidebar: { left: 0, top: 0, width: 288, height: 900 }, pane: { left: 296, top: 0, width: 1216, height: 900 }, column: { left: 520, top: 812, width: 768, height: 88 }, left: { left: 318, top: 600, width: 180, height: 225 }, right: null };

  r.start = { classes: classes(), previewGone: !el("preview"), done: !el("done").hidden, lightDarkSwitch: !el("mode-light").parentElement.hidden, openClaude: !el("open-claude").hidden,
    zonesBeforeThePageSpeaks: ["main", "sidebar", "left", "right"].map((z) => at("zone-" + z)).join(" | "), enabled: el("enabled").checked, tiles: el("presets").children.length };
  await tell(page);
  r.zonesFollowThePage = { sidebar: at("zone-sidebar"), main: at("zone-main"), left: at("zone-left"), right: at("zone-right"), middle: document.body.style.getPropertyValue("--middle"), column: document.body.style.getPropertyValue("--column") };
  const box = (id) => { const b = el(id).getBoundingClientRect(); return [b.left, b.top, b.width, b.height].map(Math.round).join(","); };
  r.panels = { bar: box("bar"), library: box("library"), inspector: box("inspector"), window: innerWidth + "x" + innerHeight, pageBackground: getComputedStyle(document.body).backgroundColor, stageBackground: getComputedStyle(el("stage")).backgroundImage, panelBackground: getComputedStyle(el("library")).backgroundColor };

  el("zone-left").click(); await wait(60);
  r.leftSelected = { grip: at("grip-left"), panel: !el("panel-side").hidden, dock: classes() };
  el("zone-right").click(); await wait(60);
  r.rightSelected = { dock: classes(), inspector: box("inspector"), grip: at("grip-right") };
  el("zone-left").click(); await wait(60);

  // moving the real page's picture: the page says where it is, the editor saves the new height
  const point = (target, type, x, y) => target.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, clientX: x, clientY: y }));
  const before = store.stickerPosition ?? 85;
  point(el("grip-left"), "pointerdown", 400, 700); point(el("grip-left"), "pointermove", 400, 500); point(el("grip-left"), "pointerup", 400, 500); await wait(60);
  r.dragOnThePage = { position: before + " to " + store.stickerPosition };

  // dropping a file straight onto the page's sidebar
  const canvas = document.createElement("canvas"); canvas.width = 400; canvas.height = 300; canvas.getContext("2d").fillRect(0, 0, 400, 300);
  const file = new File([await new Promise((ok) => canvas.toBlob(ok, "image/png"))], "p.png", { type: "image/png" });
  const dt = new DataTransfer(); dt.items.add(file);
  const fire = (target, type) => target.dispatchEvent(new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: dt }));
  fire(document.body, "dragenter");
  r.whileDragging = { classes: classes(), panelsLetItThrough: getComputedStyle(el("library")).pointerEvents + "/" + getComputedStyle(el("inspector")).pointerEvents + "/" + getComputedStyle(el("bar")).pointerEvents, zone: getComputedStyle(el("zone-sidebar")).borderTopStyle };
  const n = store.images.length; fire(el("zone-sidebar"), "dragover"); fire(el("zone-sidebar"), "drop");
  for (let i = 0; i < 400 && store.images.length === n; i++) await wait(25); await wait(80);
  r.droppedOnTheSidebar = { images: store.images.length - n, sidebarMode: store.sidebarMode, usesIt: store.sidebarImageId === store.images[store.images.length - 1].id, classes: classes() };

  // a page with no sidebar and no message box (a settings page, or the sidebar collapsed)
  await tell({ sidebar: null, pane: page.pane, column: null, left: null, right: null });
  r.pageWithoutParts = ["main", "sidebar", "left", "right"].map((z) => at("zone-" + z)).join(" | ") + " grip " + at("grip-left");
  await tell(page);

  // ----- the windows: moved by the title bar, resized by the edges, like any window -----
  el("zone-main").click(); await wait(60);
  const drag = async (handle, across, down) => { const h = handle.getBoundingClientRect(), x = h.left + Math.min(h.width / 2, 120), y = h.top + h.height / 2; point(handle, "pointerdown", x, y); point(handle, "pointermove", x + across / 2, y + down / 2); point(handle, "pointermove", x + across, y + down); point(handle, "pointerup", x + across, y + down); await wait(40); };
  const title = (id) => el(id).querySelector(".titlebar"), edge = (id, side) => el(id).querySelector(".edge." + side);
  r.windowsAtFirst = { library: box("library"), inspector: box("inspector"), bar: box("bar"), kept: JSON.stringify(store.editorWindows ?? null), titles: [...document.querySelectorAll(".titlebar b")].map((b) => b.textContent).join(","), edges: document.querySelectorAll("#library .edge").length + "+" + document.querySelectorAll("#inspector .edge").length + "+" + document.querySelectorAll("#bar .edge").length };
  await drag(title("library"), -150, -200);
  r.libraryMoved = { box: box("library"), kept: JSON.stringify(store.editorWindows.library), othersStayed: box("inspector") === r.windowsAtFirst.inspector && box("bar") === r.windowsAtFirst.bar };
  await drag(edge("library", "se"), 120, 90);
  r.libraryResizedFromCorner = { box: box("library"), kept: JSON.stringify(store.editorWindows.library) };
  await drag(edge("library", "w"), 60, 0);
  r.leftEdgeMovesOnlyTheLeft = box("library");
  await drag(edge("library", "n"), 0, -40);
  r.topEdgeMovesOnlyTheTop = box("library");
  await drag(edge("library", "nw"), 2000, 2000);
  r.neverSmallerThan = box("library");
  await drag(edge("library", "se"), 300, 160);
  const shelves = () => [...document.querySelectorAll(".shelf")].map((sh) => Math.round(sh.getBoundingClientRect().top - el("library").getBoundingClientRect().top)).join(",");
  r.contentFollowsTheSize = { box: box("library"), shelfTops: shelves(), contentScrolls: getComputedStyle(el("library").querySelector(".content")).overflowY };
  await drag(title("inspector"), -400, 100);
  r.inspectorMoved = { box: box("inspector"), staysPutWhenRightIsSelected: (el("zone-right").click(), await wait(40), box("inspector")), classes: classes() };
  el("zone-main").click();
  await drag(el("bar"), 100, 300);
  r.barMoved = box("bar");
  await drag(title("library"), -5000, 5000);
  r.cannotBeLostOffTheEdge = { box: box("library"), window: innerWidth + "x" + innerHeight };
  point(title("library"), "pointerdown", 10, 10); point(title("library"), "pointerup", 10, 10); const libraryFront = Number(el("library").style.zIndex);
  point(el("inspector"), "pointerdown", 10, 10); point(el("inspector"), "pointerup", 10, 10);
  r.pressedWindowComesToFront = Number(el("inspector").style.zIndex) > libraryFront && libraryFront > 2;
  el("inspector").querySelector(".fold").click(); await wait(30);
  r.folded = { box: box("inspector"), content: getComputedStyle(el("inspector").querySelector(".content")).display, kept: store.editorWindows.inspector.folded };
  el("inspector").querySelector(".fold").click(); await wait(30);
  r.unfolded = box("inspector");
  el("library").querySelector(".shut").click(); await wait(30);
  r.closed = { library: getComputedStyle(el("library")).display, button: el("show-library").getAttribute("aria-pressed"), kept: store.editorWindows.library.closed };
  el("show-library").click(); await wait(30);
  r.broughtBackFromTheBar = { library: getComputedStyle(el("library")).display, button: el("show-library").getAttribute("aria-pressed"), sameBox: box("library") === r.cannotBeLostOffTheEdge.box };
  el("show-inspector").click(); await wait(30); const hiddenByBar = getComputedStyle(el("inspector")).display; el("show-inspector").click(); await wait(30);
  r.barButtonTogglesSettings = hiddenByBar + " then " + getComputedStyle(el("inspector")).display;
  el("library").querySelector(".home").click(); el("inspector").querySelector(".home").click(); await wait(40);
  r.putBack = { library: box("library") === r.windowsAtFirst.library, inspector: box("inspector") === r.windowsAtFirst.inspector, kept: JSON.stringify(store.editorWindows.library) + JSON.stringify(store.editorWindows.inspector) };
  el("zone-right").click(); await wait(40);
  r.unmovedSettingsStillDodge = { classes: classes(), box: box("inspector") };
  el("zone-main").click();
  const titleButton = el("library").querySelector(".fold").getBoundingClientRect(); point(el("library").querySelector(".fold"), "pointerdown", titleButton.left + 3, titleButton.top + 3); point(el("library").querySelector(".fold"), "pointermove", titleButton.left + 80, titleButton.top + 80); point(el("library").querySelector(".fold"), "pointerup", titleButton.left + 80, titleButton.top + 80);
  r.dotsDoNotDrag = box("library") === r.windowsAtFirst.library;
  document.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true })); el("done").click(); await wait(60);
  r.closing = heard.join(" ");

  r.errors = window.errors;
  document.getElementById("out").textContent = "RESULT" + JSON.stringify(r, null, 1) + "END";
})().catch((e) => { document.getElementById("out").textContent = "RESULT" + JSON.stringify("error " + e.stack + " | " + JSON.stringify(window.errors)) + "END"; });
</script>
