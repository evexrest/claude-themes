<pre id="out"></pre>
<script>
(async () => {
  const r = {}; await wait(150);
  const el = (id) => document.getElementById(id);
  const visible = () => [...document.querySelectorAll("section")].filter((s) => !s.hidden).map((s) => s.id).join(",");
  const tabsShown = () => [...document.querySelectorAll("nav button")].filter((b) => !b.hidden).map((b) => b.textContent).join("|");
  const pressed = (sel) => [...document.querySelectorAll(sel)].map((b) => b.getAttribute("aria-pressed") === "true" ? 1 : 0).join("");
  const set = (id, v) => { el(id).value = v; el(id).dispatchEvent(new Event("input")); };
  const pick = (id, v) => { el(id).value = v; el(id).dispatchEvent(new Event("change")); };
  r.start = { visible: visible(), tabs: tabsShown(), area: pressed(".areas button") };
  const seen = {}; for (const a of ["main", "side"]) { el("area-" + a).click(); for (const t of ["background", "text", "borders", "sides"]) { if (el("tab-" + t).hidden) continue; el("tab-" + t).click(); seen[a + "/" + t] = visible(); } }
  r.sections = seen;
  el("area-main").click(); el("tab-sides").click(); el("area-side").click();
  r.sidesThenSidebar = { visible: visible(), tabs: tabsShown() };
  el("area-main").click(); el("tab-text").click();
  r.mainTextStart = { text: pressed("#text-swatches .swatch"), side: pressed("#side-text-swatches .swatch") };
  document.querySelectorAll("#text-swatches .swatch")[5].click(); await wait(20);
  r.mainText = { textColor: store.textColor, sidebarTextColor: store.sidebarTextColor ?? null };
  el("area-side").click();
  r.sideTextTab = { visible: visible(), highlightInSidebar: !!document.querySelector("#side-text [id*=code]") };
  document.querySelectorAll("#side-text-swatches .swatch")[2].click(); await wait(20);
  r.sideText = { textColor: store.textColor, sidebarTextColor: store.sidebarTextColor };
  set("side-text-color", "#123456"); await wait(20);
  r.sidePicker = { textColor: store.textColor, sidebarTextColor: store.sidebarTextColor };
  pick("side-font", "serif"); await wait(20);
  r.sideFont = { font: store.font ?? "default", sidebarFont: store.sidebarFont };
  pick("side-font", "custom"); set("side-font-custom", "Futura"); await wait(20);
  r.sideFontCustom = { sidebarFont: store.sidebarFont, name: store.sidebarFontCustom, mainBoxHidden: el("font-custom").hidden, sideBoxHidden: el("side-font-custom").hidden };
  el("area-main").click(); pick("font", "mono"); await wait(20);
  r.mainFont = { font: store.font, sidebarFont: store.sidebarFont };
  el("tab-borders").click();
  r.bordersStart = { main: pressed("#frames-main .frame-choice"), width: el("frame-width").value, sideWidth: el("frame-width-side").value };
  document.querySelectorAll("#frames-main .frame-choice")[4].click(); set("frame-width", 30); await wait(20);
  r.mainBorder = { frameMain: store.frameMain, frameSidebar: store.frameSidebar, frameWidth: store.frameWidth, frameSidebarWidth: store.frameSidebarWidth };
  el("area-side").click();
  r.sideBordersTab = { visible: visible(), side: pressed("#frames-sidebar .frame-choice"), noteHidden: el("side-combined").hidden };
  document.querySelectorAll("#frames-sidebar .frame-choice")[8].click(); set("frame-width-side", 9); await wait(20);
  r.sideBorder = { frameMain: store.frameMain, frameSidebar: store.frameSidebar, frameWidth: store.frameWidth, frameSidebarWidth: store.frameSidebarWidth };
  el("area-main").click(); el("layout-combined").click(); await wait(20); el("area-side").click();
  r.combined = { layout: store.frameLayout, sideNoteHidden: el("side-combined").hidden };
  el("area-main").click(); el("layout-separate").click(); await wait(20);
  el("area-side").click(); el("tab-background").click();
  r.sideBgStart = { mode: pressed("#side-background .pair button"), joined: !el("joined").hidden, own: !el("own").hidden, plain: !el("plain").hidden };
  el("side-plain").click(); await wait(20);
  r.sidePlain = { mode: store.sidebarMode, plainShown: !el("plain").hidden, mainPreset: store.preset };
  el("side-own").click(); document.querySelectorAll("#side-choices .choice")[7].click(); set("side-opacity", 40); await wait(20);
  r.sideOwn = { mode: store.sidebarMode, sidebarPreset: store.sidebarPreset, sidebarImageId: store.sidebarImageId, sidebarOpacity: store.sidebarOpacity, mainPreset: store.preset, mainOpacity: store.opacity ?? "default", gifLabel: document.querySelectorAll("#side-choices .choice")[7].textContent };
  el("area-main").click();
  document.querySelectorAll("#choices .choice")[3].click(); set("opacity", 70); await wait(20);
  r.mainBg = { preset: store.preset, opacity: store.opacity, sidebarPreset: store.sidebarPreset, sidebarImageId: store.sidebarImageId, sidebarOpacity: store.sidebarOpacity, sidePressedUntouched: pressed("#side-choices .choice") };
  el("choose-side").click(); r.openSide = window.openedTab; el("choose-sticker").click(); r.openSticker = window.openedTab; el("choose-frame-side").click(); r.openFrame = window.openedOptions === true;
  el("tab-sides").click(); document.querySelectorAll("#stickers-right .sticker")[2].click(); set("sticker-position", 5); await wait(20);
  r.sides = { right: store.stickerRight, left: store.stickerLeft, position: store.stickerPosition, label: el("sticker-position-value").textContent };
  document.getElementById("out").textContent = "RESULT" + JSON.stringify(r, null, 1) + "END";
})().catch((e) => { document.getElementById("out").textContent = "RESULT" + JSON.stringify("error " + e.stack) + "END"; });
</script>
