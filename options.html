<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude Themes</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main>
        <h1>Claude Themes</h1>
        <p>Choose an image, then drag and zoom until the frame shows the part you want.</p>

        <label class="button" for="file">Choose an image</label>
        <input type="file" id="file" accept="image/*" hidden>

        <div id="editor" hidden>
            <canvas id="frame"></canvas>
            <p class="hint">Drag the image to move it. The frame is the shape of your screen.</p>

            <label for="zoom">Zoom</label>
            <input type="range" id="zoom" min="1" max="4" step="0.01" value="1">

            <div class="row">
                <button id="save">Save wallpaper</button>
                <button id="remove" class="quiet">Remove wallpaper</button>
            </div>
        </div>

        <p id="status"></p>
    </main>

    <script src="settings.js"></script>
    <script src="options.js"></script>
</body>
</html>
