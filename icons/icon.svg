  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#wash)"/>
  <rect x="24" y="30" width="80" height="68" rx="10" fill="none" stroke="#ffffff" stroke-width="9"/>
  <rect x="24" y="30" width="30" height="68" rx="10" fill="#ffffff"/>
  <rect x="44" y="30" width="10" height="68" fill="#ffffff"/>
